<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Forgot Password | Dormonitory</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../assets/css/auth-styles.css" />
</head>
<body>
    <main class="landing-container forgot-password-page">
         <section class="hero-left signup-visual">
        <div class="pattern-overlay"></div>
    
        <div class="join-container">
            <img src="../assets/img/brandmark-box.png" alt="Join Community" class="brandmark-box-img">
        
            <div class="join-content">
                <h2 class="join-title">Don't Worry!</h2>
                <p class="join-text">We'll help you get back into your account in no time. Your security is our top priority.</p>
            </div>
        </div>
        </section>  

<section class="hero-right">
    <div class="back-nav-fixed">
        <a href="login.html" class="btn-go-back">
            <i class="bi bi-arrow-left"></i> Go Back
        </a>
    </div>

    <div class="login-box">
        <h2 class="auth-title">Reset Password</h2>
        <p class="auth-subtitle mb-5">Enter your email and we'll send you a link to reset your password.</p>

        <form action="reset-confirmation.html" method="GET" class="needs-validation" novalidate>
            <div class="mb-5">
                <label for="email" class="form-label">Email Address</label>
                
                <div class="input-group-custom">
                    <i class="bi bi-envelope"></i>
                    <input type="email" class="form-control" id="email" placeholder="username@gmail.com" required>
                </div>
                
                <div class="invalid-feedback">
                    Please enter a valid email address containing "@".
                </div>
            </div>

            <button type="submit" class="btn-auth-primary w-100 py-3 d-flex align-items-center justify-content-center gap-2">
                <span>Send Reset Code</span>
                <i class="bi bi-send"></i>
            </button>
        </form>
    </div>
</section>
    </main>

<script>
    (() => {
        'use strict'
        const forms = document.querySelectorAll('.needs-validation')
        Array.from(forms).forEach(form => {
            form.addEventListener('submit', event => {
                if (!form.checkValidity()) {
                    event.preventDefault()
                    event.stopPropagation()
                }
                form.classList.add('was-validated')
            }, false)
        })
    })()
</script>

</body>
</html>
