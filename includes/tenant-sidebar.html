<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
        <title>Dormonitory</title>
        <link rel="stylesheet" href="../../assets/css/sidebar-styles.css">
    </head>

    <body>
        <div class="layout">
            <aside class="sidebar" id="sidebar">
                <div class="brand">
                    <img src="../../assets/img/secondary-logo.png" alt="Brand">
                </div>

                <div class="divider"></div>

                <nav>
                    <ul>
                        <li class="active"><a href="../tenant/home.html"><img src="../../assets/img/home.png"><span>Home</span></a></li>
                        <li><a href="../tenant/digital-key.html"><img src="../../assets/img/qr.png"><span>Digital Key</span></a></li>
                        <li><a href="../tenant/invite-visitor.html"><img src="../../assets/img/invite.png"><span>Invite Visitor</span></a></li>
                    </ul>
                </nav>

                <div class="sidebar-bottom">
                    <div class="divider-bottom"></div>
                    <a href="#" class="signout-btn">
                        <img src="../../assets/img/out.png">
                        <span>Sign Out</span>
                    </a>
                </div>
            </aside>

            <main class="main" id="main">
                <div class="topbar">
                    <button class="hamburger" id="hamburger">
                        <span></span><span></span><span></span>
                    </button>
                </div>
            </main>
        </div>

        <script>
            const btn = document.getElementById('hamburger');
            const sidebar = document.getElementById('sidebar');
            const main = document.getElementById('main');
            btn.onclick = () => {
                sidebar.classList.toggle('closed');
                main.classList.toggle('full');
            };
        </script>
    </body>
</html>
